<!DOCTYPE html>
<html lang="ms">
<head>
    <meta charset="UTF-8">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link href="https://fonts.googleapis.com/css2?family=Open+Sans:wght@600;700&display=swap" rel="stylesheet">
    <style>
        body { font-family: 'Open Sans', sans-serif; background: transparent; margin: 0; padding: 10px; }
        .launchpad-grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(150px, 1fr)); gap: 10px; max-width: 1100px; margin: 0 auto; }
        .launchpad-card { display: flex; align-items: center; gap: 10px; padding: 10px 12px; background: #ffffff; border: 1px solid #dadce0; border-radius: 8px; text-decoration: none; color: #202124; transition: all 0.2s; box-shadow: 0 1px 2px rgba(0,0,0,0.05); }
        .launchpad-card:hover { transform: translateY(-2px); border-color: #1a237e; background: #fff5f5; text-decoration: none; }
        .launchpad-icon { width: 34px; height: 34px; border-radius: 6px; display: flex; align-items: center; justify-content: center; color: white; font-size: 18px; flex-shrink: 0; }
        .launchpad-text h4 { margin: 0; font-size: 12px; font-weight: 700; }
        .launchpad-text span { font-size: 10px; color: #5f6368; }
    </style>
</head>
<body>
    <div class="launchpad-grid">
        <a href="https://d3.delima.edu.my/" target="_blank" class="launchpad-card">
            <div class="launchpad-icon" style="background: #1a237e;"><i class="fas fa-graduation-cap"></i></div>
            <div class="launchpad-text">
                <h4>Portal DELIMa</h4>
                <span>d3.delima.edu.my</span>
            </div>
        </a>
        <a href="https://classroom.google.com/" target="_blank" class="launchpad-card">
            <div class="launchpad-icon" style="background: #1e8e3e;"><i class="fab fa-google"></i></div>
            <div class="launchpad-text">
                <h4>Classroom</h4>
                <span>Bilik Darjah Digital</span>
            </div>
        </a>
        <a href="https://drive.google.com/" target="_blank" class="launchpad-card">
            <div class="launchpad-icon" style="background: #1a73e8;"><i class="fab fa-google-drive"></i></div>
            <div class="launchpad-text">
                <h4>Google Drive</h4>
                <span>Storan Dokumen</span>
            </div>
        </a>
        <a href="https://sites.google.com/moe-dl.edu.my/amc-smart-booking-ver1/laman-utama" target="_blank" class="launchpad-card">
            <div class="launchpad-icon" style="background: #1565c0;"><i class="fas fa-calendar-check"></i></div>
            <div class="launchpad-text">
                <h4>Smart Booking</h4>
                <span>Tempahan Makmal</span>
            </div>
        </a>
        <a href="https://www.canva.com/education/" target="_blank" class="launchpad-card">
            <div class="launchpad-icon" style="background: #7b1fa2;"><i class="fas fa-palette"></i></div>
            <div class="launchpad-text">
                <h4>Canva EDU</h4>
                <span>Bahan Grafik Guru</span>
            </div>
        </a>
        <a href="https://drive.google.com/drive/folders/10HBSO2m-RKMAEJPsKmPmHZ1HU6zw4-y8?usp=sharing" target="_blank" class="launchpad-card">
            <div class="launchpad-icon" style="background: #0288d1;"><i class="fas fa-folder-open"></i></div>
            <div class="launchpad-text">
                <h4>E-Fail DELIMa</h4>
                <span>Evidens 2026</span>
            </div>
        </a>
    </div>
</body>
</html>
